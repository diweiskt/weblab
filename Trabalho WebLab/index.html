<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho WebLab</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Huninn&family=WDXL+Lubrifont+SC&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="headerContainer">
            <div class="btEsquerda">
                <button id="theme-button">
                <img id="theme-icon" src="img/darkMode.svg">
                </button>
            </div>

            <nav class="menu">
                <ul>
                    <li><a href="#home">Início</a></li>
                    <li><a href="sobre.html">Sobre</a></li>
                    <li><a href="#contato">Contato</a></li>
                </ul>
            </nav>
            
            <div class="btDireita">
                <button id="fonteMaior">
                    <img src="img/text+.svg">
                </button>
                <button id="fonteMenor">
                    <img src="img/text-.svg">
                </button>
            </div>
        </div>
    </header>

    <main id="home">
        <section>
            <div class="centerimg">
                <img src="img/Ciberseguranca0.png">
            </div>
            <div class="duasimg">
                <img src="img/Ciberseguranca1.png">
                <img src="img/Ciberseguranca2.png">
            </div>
            <div class="duasimg">
                <img src="img/Ciberseguranca3.png">
                <img src="img/Ciberseguranca4.png">
            </div>
            <div class="duasimg">
                <img src="img/Ciberseguranca5.png">
                <img src="img/Ciberseguranca6.png">
            </div>
            <div class="centerimg">
                <img src="img/Ciberseguranca7.png">
            </div>
        </section>

        <section id="contato">
            <h1>Fale Conosco</h1>
            <form id="contato-form">
                <fieldset>
                    <legend>Dados para Contato</legend>
                    <br>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required><br>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required><br>

                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="4" required></textarea>

                    <input type="submit" value="Enviar">
                    
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 É OS TERROR - Todos os direitos reservados</p>
    </footer>

    <script src="js/javascript.js"></script>
</body>
</html>
